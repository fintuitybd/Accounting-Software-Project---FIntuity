    <meta name="description" content="LedgerVault — the modern finance, tax and compliance operating system for Bangladesh." />
    <title>LedgerVault · Finance &amp; Tax OS</title>
    <script>
      // Paint the saved theme before React mounts so a dark-room CFO never sees a light flash.
      (function () {
        try {
          var requested = new URLSearchParams(window.location.search).get('theme');
          var theme = requested ? requested.toUpperCase() : null;
          if (!theme) {
            var raw = window.localStorage.getItem('ledgervault.v2.vault');
            if (raw) {
              var parsed = JSON.parse(raw);
              theme = parsed && parsed.state && parsed.state.theme;
            }
          }
          if (theme === 'DARK') document.documentElement.classList.add('dark');
          else if (theme === 'CONTRAST') document.documentElement.classList.add('hc');
        } catch (error) {
          /* Private mode or a malformed snapshot — the app will apply the preference on mount. */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
