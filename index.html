    <script>
      // Paint the saved theme before React mounts so a dark-room user never sees a light flash.
      // Marketing stays on warm paper regardless of the authenticated app preference.
      (function () {
        try {
          var path = window.location.pathname;
          var appPath =
            path.indexOf('/app') === 0 ||
            path.indexOf('/login') === 0 ||
            path.indexOf('/forgot-password') === 0 ||
            path.indexOf('/reset-password') === 0 ||
            path.indexOf('/accept-invitation') === 0 ||
            path.indexOf('/verify-email') === 0 ||
            path.indexOf('/session-expired') === 0 ||
            path.indexOf('/design') === 0;
          if (!appPath) return;
          var requested = new URLSearchParams(window.location.search).get('theme');
          var theme = requested ? requested.toUpperCase() : null;
          if (!theme) {
            var preferences = window.localStorage.getItem('ledgervault.v2.preferences');
            if (preferences) {
              var parsedPreferences = JSON.parse(preferences);
              theme = parsedPreferences && parsedPreferences.theme;
            }
          }
          if (!theme) {
            var raw = window.localStorage.getItem('ledgervault.v2.vault');
            if (raw) {
              var parsed = JSON.parse(raw);
              theme = parsed && parsed.state && parsed.state.theme;
            }
          }
          if (theme === 'DARK') document.documentElement.classList.add('dark');
          else if (theme === 'CONTRAST') document.documentElement.classList.add('hc');
        } catch (error) {
          /* Private mode or a malformed snapshot — the app will apply the preference on mount. */
        }
      })();
    </script>
